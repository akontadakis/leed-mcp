name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --extra dev --no-editable --reinstall-package leed-mcp
      # No Radiance on the runners: the tests that need it are skipped or faked.
      - run: uv run --no-sync python tools/no_radiance.py uv run --no-sync python tools/check.py -q
